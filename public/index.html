<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
	<link rel="stylesheet" href="assets/css/main.css">

	<title>Frontend Mentor | Tip calculator app</title>

	<!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
	<style>
		.attribution {
			font-size: 0.6875rem;
			text-align: center;
		}

		.attribution a {
			color: hsl(228, 45%, 44%);
		}
	</style>
</head>
<body>
<main>
	<img class="logo" src="assets/images/logo.svg" alt="">
	<article>
		<div class="bill">
			<h1 class="text-preset-5 grey-500">Bill</h1>
			<form id="form">
				<div class="input-container">
					<img class="icon-left" src="assets/images/icon-dollar.svg" alt="">
					<input class="value-right text-preset-3 green-900" type="number" id="bill" placeholder="0">
				</div>
				<h2 class="text-preset-5 grey-500">Select Tip %</h2>
				<div class="button-container">
					<button class="tip-button text-preset-3" type="submit">5%</button>
					<button class="tip-button text-preset-3" type="submit">10%</button>
					<button class="tip-button text-preset-3 default" type="submit">15%</button>
					<button class="tip-button text-preset-3" type="submit">25%</button>
					<button class="tip-button text-preset-3" type="submit">50%</button>
					<button class="tip-button text-preset-3 tip-button-custom" type="submit">Custom</button>
				</div>
				<h2 class="text-preset-5 grey-500">Number of People</h2>
				<div class="input-container">
					<img class="icon-left" src="assets/images/icon-person.svg" alt="">
					<input class="value-right text-preset-3 green-900" type="number" id="people" placeholder="0">
				</div>
			</form>
		</div>
		<div class="total">
			<div class="tip-amount-container">
				<h2 class="text-preset-5 white">Tip Amount</h2>
				<p class="text-preset-6 grey-400">/ person</p>
			</div>
			<div class="tip-amount-value-container">
				<p class="text-preset-2 green-400">
					$4.27
				</p>
			</div>
			<div class="total-amount-container">
				<h2 class="text-preset-5 white">Total</h2>
				<p class="text-preset-6 grey-400">
					/ person
				</p>
			</div>
			<div class="total-amount-value-container">
				<p class="text-preset-2 green-400">
					$32.79
				</p>
			</div>
			<button id="reset-button" type="button" class="text-preset-4">RESET</button>
		</div>
	</article>
</main>
